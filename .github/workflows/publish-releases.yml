name: Publish HDR Guard releases

on:
  push:
    branches: [main]
    paths:
      - theme.json
      - "releases/**"
      - ".github/workflows/publish-releases.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'kcussiefil/Zen-Compact-Transparent-HDR-Guard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, regressions and release policy (mandatory preflight)
        shell: bash
        run: |
          set -euo pipefail
          node --check sdr-glass.uc.js
          node --check video-page.uc.js
          node --check selected-color.uc.js
          node --check actors/ZcthUniversalParent.sys.mjs
          node --check actors/ZcthUniversalChild.sys.mjs
          node --test tests/*.test.*
          node benchmarks/compare-v030-v031.cjs
          node benchmarks/compare-v031-v032-preview.cjs
      - name: Publish release from canonical notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current="$(node -p "JSON.parse(require('fs').readFileSync('theme.json', 'utf8')).version")"
          tag="v$current"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad tag: $tag"; exit 1; }
          notes="releases/$tag.md"
          test -s "$notes"
          title="$(head -n 1 "$notes" | sed 's/^# //')"
          [[ "$title" == "Zen Compact Transparent HDR Guard $tag — "* ]] || {
            echo "Release title does not follow docs/RELEASE_POLICY.md"; exit 1;
          }
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Already published: $tag (historical release unchanged)"
          else
            gh release create "$tag" --repo "$GH_REPO" --target "$GITHUB_SHA" \
              --title "$title" --notes-file "$notes"
            echo "Published $tag from $GITHUB_SHA"
          fi
