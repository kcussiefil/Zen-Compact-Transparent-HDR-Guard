name: HDR Guard 020 regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check sdr-glass.uc.js
          node --check video-page.uc.js
          node --check actors/ZcthUniversalParent.sys.mjs
          node --check actors/ZcthUniversalChild.sys.mjs
      - name: Automated regressions
        run: node --test tests/*.test.*
